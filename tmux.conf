# ~/.tmux.conf — Ghostty locally, tmux on this box / remotes
# tmux 3.3+ (3.4+ for hyperlinks). Catppuccin v2 via TPM.
#
# TPM: prefix + I install, prefix + U update, prefix + alt-u uninstall
# First attach auto-clones TPM + plugins if they're missing.

# --- prefix ---
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind a last-window

# --- terminal / Ghostty ---
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB:hyperlinks:strikethrough:usstyle"
set -as terminal-features ",xterm-256color:RGB:hyperlinks:strikethrough:usstyle"
set -as terminal-overrides ",*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
set -g xterm-keys on
set -g allow-passthrough on
set -s set-clipboard on

# --- feel ---
set -s escape-time 0
set -g focus-events on
set -g mouse on
set -g history-limit 100000
set -g aggressive-resize on
set -g detach-on-destroy off
set -g display-time 1500
set -g set-titles on
set -g set-titles-string "#h:#S:#W"
set -g status-interval 1
set -g status-position top

# --- windows ---
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g allow-rename on
setw -g automatic-rename on
setw -g automatic-rename-format "#{b:pane_current_command}"
setw -g monitor-activity on
set -g visual-activity off

set -g remain-on-exit-format "dead #{?pane_dead_status,status #{pane_dead_status},}"
bind R respawn-pane -k

# --- splits / windows in current directory ---
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind '%' split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# terminator-style: alt-arrow between panes (Ghostty uses ctrl-alt for its splits)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

bind -n M-n next-window
bind -n M-p previous-window
bind Left previous-window
bind Right next-window

# --- copy mode (vi) → local clipboard via OSC 52 ---
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel

# --- session hygiene ---
bind r source-file ~/.tmux.conf \; display-message "reloaded"
bind s choose-tree -Zs
bind w choose-tree -Zw
bind C new-window -n claude
bind G new-window -n grok

# --- catppuccin / bar chrome ---
# gallery: ~/work/tmux-bar-gallery.html  (or tmux-bar-gallery.png)
# ghost | pipes | chips | pills | slant
set -g @bar_style "pipes"

set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "text"
# Pacific 12-hour via ~/.config/tmux/when.sh (PDT in summer, PST in winter).
set -g @catppuccin_date_time_text " #($HOME/.config/tmux/when.sh)"

# nerd icons — catalog: ~/work/tmux-bar-gallery/glyphs.html
# host swap:  tux  󰒋 rack  󰇅 tower  󰪫 tower+monitor  󰟀 classic-pc
#             desktop   laptop  󰣳 nas   tux   popos   lock  󰒍 net
set -g @host_icon ""
set -g @session_icon "󰀘"
set -g @holon_red "#e80028"
# sep swap: │ light  ┃ heavy  ║ double  ┆ dashed  · dot  • bullet  › chevron  ❯   pl-soft
set -g @sep "┃"
# windows: 󰓩 md-tab (current)  󰓪 md-tab-unselected  + 󰬺..󰭂 md-numeric-1..9
set -g @tab_icon "󰓩"
set -g @tab_icon_off "󰓪"
set -g @win_num "#{?#{==:#{window_index},1},󰬺,#{?#{==:#{window_index},2},󰬻,#{?#{==:#{window_index},3},󰬼,#{?#{==:#{window_index},4},󰬽,#{?#{==:#{window_index},5},󰬾,#{?#{==:#{window_index},6},󰬿,#{?#{==:#{window_index},7},󰭀,#{?#{==:#{window_index},8},󰭁,#{?#{==:#{window_index},9},󰭂,#I}}}}}}}}}"
set -g @catppuccin_host_icon "#{@host_icon} "
set -g @catppuccin_session_icon "#{@session_icon} "
set -g @catppuccin_cpu_icon " "
set -g @catppuccin_ram_icon " "
set -g @catppuccin_load_icon "󰓅 "
set -g @catppuccin_date_time_icon " "

# GrokNight paper — match the grok TUI, not #000 / colour232
set -g @catppuccin_status_background "#141414"

set -g @catppuccin_window_status_style "none"
if-shell -F '#{==:#{@bar_style},chips}' {
  set -g @catppuccin_window_status_style "basic"
  set -g @catppuccin_status_left_separator ""
  set -g @catppuccin_status_right_separator " "
  set -g @catppuccin_status_connect_separator "yes"
}
if-shell -F '#{==:#{@bar_style},pills}' {
  set -g @catppuccin_window_status_style "rounded"
  set -g @catppuccin_status_left_separator ""
  set -g @catppuccin_status_right_separator ""
  set -g @catppuccin_status_connect_separator "no"
}
if-shell -F '#{==:#{@bar_style},slant}' {
  set -g @catppuccin_window_status_style "slanted"
  set -g @catppuccin_status_left_separator ""
  set -g @catppuccin_status_right_separator ""
  set -g @catppuccin_status_connect_separator "yes"
}

# --- plugins (TPM clones catppuccin/tmux as ~/.tmux/plugins/tmux) ---
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'tmux-plugins/tpm'

# first run: clone TPM and fetch plugins before we try to source catppuccin
if-shell '[ ! -d "$HOME/.tmux/plugins/tpm" ]' {
  run-shell 'git clone https://github.com/tmux-plugins/tpm "$HOME/.tmux/plugins/tpm" && "$HOME/.tmux/plugins/tpm/bin/install_plugins"'
}

if-shell '[ -f "$HOME/.tmux/plugins/tmux/catppuccin.tmux" ]' {
  run-shell "$HOME/.tmux/plugins/tmux/catppuccin.tmux"
}

set -g status-left-length 100
set -g status-right-length 220
set -g status-left "#{E:@catppuccin_status_host}"
set -ag status-left "#{E:@catppuccin_status_session}"
set -gF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -agF status-right "#{E:@catppuccin_status_load}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

if-shell -F '#{==:#{@bar_style},ghost}' {
  set -g status-left "#[fg=#{@thm_mauve}]#{@host_icon} #[bold]#h  #{?client_prefix,#[bg=#{@holon_red}]#[fg=#{@thm_crust}] #{@session_icon} #S ,#[fg=#{@holon_red}]#{@session_icon} #[fg=#{@thm_fg},bold]#S } "
  set -g window-status-separator ""
  set -g window-status-format "#[fg=#{@thm_overlay_0}] #{@tab_icon_off} #{E:@win_num} #W#{?window_activity_flag, #[fg=#{@thm_peach}]󱅫,} "
  set -g window-status-current-format "#[fg=#{@thm_fg},bold] #{@tab_icon} #{E:@win_num} #W#{?window_zoomed_flag, 󰍉,} "
  set -g status-right "#[fg=#{@thm_yellow}] #{cpu_percentage} #($HOME/.config/tmux/spark.sh cpu)  #[fg=#{@thm_blue}] #{ram_percentage} #($HOME/.config/tmux/spark.sh mem)  #[fg=#{@thm_teal}]󰓅 #(awk '{print $1}' /proc/loadavg)  #[fg=#{@thm_flamingo}]󰓁 #($HOME/.config/tmux/procs.sh p)  #[fg=#{@thm_pink}]󰌨 #($HOME/.config/tmux/procs.sh t)  #[fg=#{@thm_lavender}]󰐰 #($HOME/.config/tmux/uptime.sh)  #[fg=#{@thm_sky}]󰃭 #($HOME/.config/tmux/when.sh date)  #[fg=#{@thm_overlay_0}] #($HOME/.config/tmux/when.sh time) "
}
if-shell -F '#{==:#{@bar_style},pipes}' {
  set -g status-left "#[fg=#{@thm_mauve}]#{@host_icon} #[bold]#h #[fg=#{@thm_surface_1}]#{@sep}#{?client_prefix,#[bg=#{@holon_red}]#[fg=#{@thm_crust}] #{@session_icon} #S ,#[fg=#{@holon_red}] #{@session_icon} #[fg=#{@thm_fg},bold]#S }#[fg=#{@thm_surface_1}]#{@sep}"
  set -gF window-status-separator "#[fg=#{@thm_surface_1}]#{@sep}"
  set -g window-status-format " #[fg=#{@thm_overlay_0}]#{@tab_icon_off} #{E:@win_num} #[fg=#{@thm_subtext_0}]#W#{?window_activity_flag, #[fg=#{@thm_peach}]󱅫,} "
  set -g window-status-current-format "#[fg=#{@thm_crust},bg=#{@thm_mauve},bold] #{@tab_icon} #{E:@win_num} #W#{?window_zoomed_flag, 󰍉,} "
  set -g status-right "#[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_yellow}] #{cpu_percentage} #($HOME/.config/tmux/spark.sh cpu) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_blue}] #{ram_percentage} #($HOME/.config/tmux/spark.sh mem) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_teal}]󰓅 #(awk '{print $1,$2,$3}' /proc/loadavg) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_flamingo}]󰓁 #($HOME/.config/tmux/procs.sh p) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_pink}]󰌨 #($HOME/.config/tmux/procs.sh t) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_lavender}]󰐰 #($HOME/.config/tmux/uptime.sh) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_sky}]󰃭 #($HOME/.config/tmux/when.sh date) #[fg=#{@thm_surface_1}]#{@sep} #[fg=#{@thm_overlay_0}] #($HOME/.config/tmux/when.sh time) "
}

# paint the pane the same charcoal even when the remote default is true black
set -g window-style "bg=#141414"
set -g window-active-style "bg=#141414"
set -g status-style "bg=#141414,fg=#{@thm_fg}"

run-shell "$HOME/.tmux/plugins/tpm/tpm"
